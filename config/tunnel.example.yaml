# Sample only. Do not put Dhan credentials or raw API keys in this file.
# Use YOUR existing OpenAI tunnel ID and registration.
# Start with: tunnel-client run --config path/to/this.yaml
# Full schema: https://github.com/openai/tunnel-client/blob/master/docs/configuration.md
config_version: 1
control_plane:
  base_url: https://api.openai.com
  tunnel_id: REPLACE_WITH_YOUR_TUNNEL_ID
  api_key: env:CONTROL_PLANE_API_KEY
health:
  listen_addr: '127.0.0.1:8082'
mcp:
  server_urls:
    - channel: main
      url: 'http://127.0.0.1:8766/mcp'
